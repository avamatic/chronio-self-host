<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chronio playlist configuration</title>
<style>body{font:17px system-ui;background:#151922;color:#eee;max-width:850px;margin:40px auto;padding:0 22px}input,textarea,select,button{font:inherit;border:1px solid #687386;border-radius:6px;padding:10px;background:#232b39;color:#fff;margin:7px 0}input,textarea{box-sizing:border-box;width:100%}button{cursor:pointer}label{display:block;margin-top:18px}textarea{min-height:160px}#status{white-space:pre-wrap;color:#b8d6ff}a{color:#b8d6ff}fieldset{border:1px solid #687386;border-radius:8px;margin-top:24px}.row{display:flex;gap:8px}.row input{width:auto;flex:1}.row button{flex:0}#editor[hidden]{display:none}</style>
<h1>Playlist configuration</h1><p>Manage the playlist sources and selections shared by your Chronio devices.</p><p><a href="/">Account dashboard</a></p>
<form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form>
<section id="editor" hidden><label>Profile<select id="profile"></select></label><button id="reload">Reload configuration</button><button id="logout">Sign out</button><label>Source URLs, one per line in display order<textarea id="sources" spellcheck="false" placeholder="https://your-playlist-host/v1/index.json"></textarea></label><h2>Disabled playlists</h2><p>Enter the playlist's source URL and id from its index. Other playlists are enabled.</p><div id="disabled"></div><button id="add">Add disabled playlist</button><p><button id="save">Save configuration</button></p></section><p id="status" role="status" aria-live="polite"></p>
<script type="module" src="/playlists/app.js"></script></html>
