apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ghcr-pull
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: db
        image: docker.io/supabase/postgres@sha256:95d92e9563121189086690a4b7f8f2b711a4809a2499f45592199aae68ebae5f
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: chronio-env
              key: db__POSTGRES_HOST
        - name: PGPORT
          valueFrom:
            secretKeyRef:
              name: chronio-env
              key: db__PGPORT
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: chronio-env
              key: db__POSTGRES_PORT
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: chronio-env
              key: db__PGPASSWORD
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chronio-env
              key: db__POSTGRES_PASSWORD
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: chronio-env
              key: db__PGDATABASE
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: chronio-env
              key: db__POSTGRES_DB
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: chronio-env
              key: db__JWT_SECRET
        - name: JWT_EXP
          valueFrom:
            secretKeyRef:
              name: chronio-env
              key: db__JWT_EXP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        args:
        - postgres
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        - -c
        - log_min_messages=fatal
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
        - name: db-config
          mountPath: /etc/postgresql-custom
        - name: init
          mountPath: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
          subPath: init-scripts/99-roles.sql
          readOnly: true
        - name: init
          mountPath: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
          subPath: init-scripts/99-jwt.sql
          readOnly: true
        - name: init
          mountPath: /docker-entrypoint-initdb.d/migrations/99999999990000-nuvio-baseline.sql
          subPath: migrations/99999999990000-nuvio-baseline.sql
          readOnly: true
        - name: init
          mountPath: /docker-entrypoint-initdb.d/migrations/99999999990001-nuvio-auth-trigger.sql
          subPath: migrations/99999999990001-nuvio-auth-trigger.sql
          readOnly: true
        startupProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -U postgres -h localhost && psql -U supabase_admin -d postgres
              -Atqc "select exists(select 1 from nuvio_migrations.schema_migrations
              where version = '00000000000001')" | grep -qx t
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -h
            - localhost
          periodSeconds: 10
      volumes:
      - name: payload
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: init
        emptyDir: {}
      - name: db-data
        persistentVolumeClaim:
          claimName: db-data
      - name: db-config
        persistentVolumeClaim:
          claimName: db-config
      initContainers:
      - name: assets
        image: chronio-payload
        command:
        - sh
        - -ec
        - sh /opt/chronio/chronio/prepare-db.sh
        volumeMounts:
        - name: payload
          mountPath: /payload
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      - name: prepare-config
        image: docker.io/supabase/postgres@sha256:95d92e9563121189086690a4b7f8f2b711a4809a2499f45592199aae68ebae5f
        command:
        - sh
        - -ec
        - if [ ! -e /config/.initialized ]; then cp -a /etc/postgresql-custom/. /config/;
          touch /config/.initialized; fi
        volumeMounts:
        - name: db-config
          mountPath: /config
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
