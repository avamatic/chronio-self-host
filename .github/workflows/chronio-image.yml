name: Chronio Self Host image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: chronio/Dockerfile
          push: true
          tags: ghcr.io/avamatic/chronio-self-host:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/avamatic/chronio-self-host
            org.opencontainers.image.revision=${{ github.sha }}
      - run: echo '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
