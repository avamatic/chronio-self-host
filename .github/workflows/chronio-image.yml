name: Chronio Self Host image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: chronio/Dockerfile
          push: true
          tags: ghcr.io/avamatic/chronio-self-host:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/avamatic/chronio-self-host
            org.opencontainers.image.revision=${{ github.sha }}
      - run: echo '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: chronio/dashboard/Dockerfile
          push: true
          load: true
          tags: ghcr.io/avamatic/chronio-account-dashboard:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/avamatic/chronio-self-host
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify dashboard branding and browser assets
        run: |
          docker run -d --name chronio-dashboard -p 127.0.0.1:18080:8080 \
            -e NUVIO_SUPABASE_URL=http://127.0.0.1:9999 \
            -e NUVIO_SUPABASE_ANON_KEY=test-public-key \
            -e NUVIO_PUBLIC_SITE_URL=http://127.0.0.1:18080 \
            ghcr.io/avamatic/chronio-account-dashboard:${{ github.sha }}
          python3 tests/smoke-dashboard.py http://127.0.0.1:18080
      - run: echo '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
